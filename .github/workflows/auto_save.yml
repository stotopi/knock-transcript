name: Auto Save YouTube Transcript

on:
  # 2時間おきに自動実行（毎時0分・偶数時間）
  schedule:
    - cron: '0 */2 * * *'
  # 手動で今すぐテスト実行したい時用のボタンを有効化
  workflow_dispatch:

jobs:
  save-transcript:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]" youtube-transcript-api google-api-python-client google-auth

      - name: Run transcript saver script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python save_youtube_transcript_to_drive.py
